version: '3.9'

services:
  mysql:
    image: mysql
    container_name: mysql
    ports:
      - 3306:3306
      - 33060:33060
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=bootdb
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=root --execute \"SHOW DATABASES;\""
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - inatel

  publisher-manager:
    image: adautomendes/publisher-manager
    container_name: publisher-manager
    ports:
      - 8080:8080
    healthcheck:
      test: curl --fail http://localhost:8080/publisher || exit 1
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - SERVER_HOST=publisher-manager
      - SERVER_PORT=8080
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inatel

  game-manager:
    image: game-manager
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        JAR_FILE: target/game-0.0.1-SNAPSHOT.jar
    container_name: game-manager
    ports:
      - 8081:8081
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PUBLISHER_MANAGER_HOST=publisher-manager
      - PUBLISHER_MANAGER_PORT=8080
      - GAME_MANAGER_HOST=game-manager
      - GAME_MANAGER_PORT=8081
      - MYSQL_CONTAINER=mysql
      - MYSQL_PORT=3306
    networks:
      - inatel
    depends_on:
      publisher-manager:
        condition: service_healthy
networks:
  inatel:
    name: inatel
    driver: bridge