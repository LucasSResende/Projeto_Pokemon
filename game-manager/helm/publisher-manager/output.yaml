---
# Source: publisher-manager/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: publisher-manager
  labels:
    helm.sh/chart: publisher-manager-0.1.0
    app.kubernetes.io/name: publisher-manager
    app.kubernetes.io/instance: publisher-manager
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: publisher-manager
---
# Source: publisher-manager/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher-manager
  labels:
    app: publisher-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publisher-manager
  template:
    metadata:
      labels:
        app: publisher-manager
    spec:
      containers:
        - name: publisher-manager
          image: "adautomendes/publisher-manager:latest"
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: GAME_MANAGER_HOST
              value: "localhost"
            - name: GAME_MANAGER_PORT
              value: "8081"
            - name: SERVER_HOST
              value: "publisher-manager"
            - name: SERVER_PORT
              value: "8080"
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_PORT
              value: "3306"
---
# Source: publisher-manager/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "publisher-manager-test-connection"
  labels:
    helm.sh/chart: publisher-manager-0.1.0
    app.kubernetes.io/name: publisher-manager
    app.kubernetes.io/instance: publisher-manager
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: [ 'wget' ]
      args: [ 'publisher-manager:8080' ]
  restartPolicy: Never
