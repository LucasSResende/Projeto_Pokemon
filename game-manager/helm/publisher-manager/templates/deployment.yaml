apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "publisher-manager.fullname" . }}
  labels:
    app: {{ include "publisher-manager.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "publisher-manager.name" . }}
  template:
    metadata:
      labels:
        app: {{include "publisher-manager.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag}}"
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.env.SPRING_PROFILES_ACTIVE}}"
            - name: SERVER_HOST
              value: "{{ .Values.env.SERVER_HOST}}"
            - name: SERVER_PORT
              value: "{{ .Values.env.SERVER_PORT}}"
            - name: MYSQL_HOST
              value: "{{ .Values.env.MYSQL_HOST }}"
            - name: MYSQL_PORT
              value: "{{ .Values.env.MYSQL_PORT }}"