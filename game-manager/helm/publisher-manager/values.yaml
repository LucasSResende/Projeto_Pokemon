replicaCount: 1
image:
  repository: adautomendes/publisher-manager
  tag: 1.0.1
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
env:
  SPRING_PROFILES_ACTIVE: prod
  PUBLISHER_MANAGER_HOST: publisher-manager
  PUBLISHER_MANAGER_PORT: "8080"
  GAME_MANAGER_PORT: "8081"
  GAME_MANAGER_HOST: "game-manager"
  MYSQL_CONTAINER: "mysql"
  MYSQL_PORT: "3306"
ingress:
  enabled: false
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
nameOverride: publisher-manager
fullnameOverride: publisher-manager