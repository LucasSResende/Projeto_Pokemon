apiVersion: v1
kind: Service
metadata:
  name: {{ include "game-manager.name" . }}
  labels:
    {{- include "game-manager.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    app: {{ include "game-manager.name" . }}