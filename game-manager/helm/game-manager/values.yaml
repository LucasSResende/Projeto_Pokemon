replicaCount: 1
image:
  repository: lucassresende/game-manager
  tag: latest
service:
  port: 8080
  targetPort: 8080
env:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  SERVER_HOST: localhost
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  PUBLISHER_MANAGER_HOST: publisher-manager
  PUBLISHER_MANAGER_PORT: "9090"
ingress:
  enabled: false
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
nameOverride: game-manager
fullnameOverride: game-manager