replicaCount: 1
image:
  repository: lucassresende/game-manager
  tag: latest
service:
  port: 8081
  targetPort: 8081
env:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8081"
  SERVER_HOST: localhost
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  PUBLISHER_MANAGER_HOST: publisher-manager
  PUBLISHER_MANAGER_PORT: "8080"
ingress:
  enabled: false
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
nameOverride: game-manager
fullnameOverride: game-manager