replicaCount: 1
image:
  repository: lucassresende/game-manager
  tag: 1.0.1
service:
  port: 8081
  targetPort: 8081
env:
  SPRING_PROFILES_ACTIVE: prod
  GAME_MANAGER_PORT: "8081"
  GAME_MANAGER_HOST: localhost
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_ROOT_PASSWORD: "root"
  MYSQL_ROOT_USERNAME: "root"
  SERVER_HOST: publisher-manager
  SERVER_PORT: "8080"
ingress:
  enabled: false
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
nameOverride: game-manager
fullnameOverride: game-manager