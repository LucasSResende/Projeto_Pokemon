replicaCount: 1
image:
  repository: lucassresende/game-manager
  tag: 1.0.1
service:
  port: 8081
  targetPort: 8081
env:
  SPRING_PROFILES_ACTIVE: prod
  PUBLISHER_MANAGER_HOST: publisher-manager
  PUBLISHER_MANAGER_PORT: "8080"
  GAME_MANAGER_PORT: "8081"
  MYSQL_CONTAINER: "mysql"
  MYSQL_PORT: "3306"
  GAME_MANAGER_HOST: "game-manager"
ingress:
  enabled: false
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
nameOverride: game-manager
fullnameOverride: game-manager