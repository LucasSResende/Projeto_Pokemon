---
# Source: game-manager-full/templates/game-manager/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-manager
  labels:
    app: game-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-manager

  template:
    metadata:
      labels:
        app: game-manager
    spec:
      containers:
        - name: game-manager
          image: "lucassresende/game-manager:latest"
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "8081"
            - name: SERVER_HOST
              value: "localhost"
            - name: PUBLISHER_MANAGER_HOST
              value: "publisher-manager"
            - name: PUBLISHER_MANAGER_PORT
              value: "8080"
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_PORT
              value: "3306"
---
# Source: game-manager-full/templates/mysql/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: game-manager-full
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: "mysql:8.0.29"
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: bootdb
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: mysql-pv-claim
---
# Source: game-manager-full/templates/publisher-manager/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher-manager
  labels:
    app: publisher-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publisher-manager
  template:
    metadata:
      labels:
        app: publisher-manager
    spec:
      containers:
        - name: publisher-manager
          image: "adautomendes/publisher-manager:latest"
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: GAME_MANAGER_HOST
              value: "localhost"
            - name: GAME_MANAGER_PORT
              value: "8081"
            - name: SERVER_HOST
              value: "publisher-manager"
            - name: SERVER_PORT
              value: "8080"
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_PORT
              value: "3306"
