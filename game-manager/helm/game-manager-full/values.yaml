gameManager:
  replicaCount: 1
  image:
    repository: lucassresende/game-manager
    tag: latest
  service:
    port: 8081
    targetPort: 8081
  env:
    SPRING_PROFILES_ACTIVE: prod
    SERVER_PORT: "8081"
    SERVER_HOST: localhost
    MYSQL_HOST: "mysql"
    MYSQL_PORT: "3306"
    PUBLISHER_MANAGER_HOST: publisher-manager
    PUBLISHER_MANAGER_PORT: "8080"
  ingress:
    enabled: false
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  nameOverride: game-manager
  fullnameOverride: game-manager

publisherManager:
  replicaCount: 1
  image:
    repository: adautomendes/publisher-manager
    tag: latest
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  env:
    SPRING_PROFILES_ACTIVE: prod
    GAME_MANAGER_PORT: "8081"
    GAME_MANAGER_HOST: localhost
    MYSQL_HOST: "mysql"
    MYSQL_PORT: "3306"
    SERVER_HOST: publisher-manager
    SERVER_PORT: "8080"
  ingress:
    enabled: false
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  nameOverride: publisher-manager
  fullnameOverride: publisher-manager

mysql:
  replicaCount: 1
  image:
    repository: mysql
    tag: 8.0.29
  service:
    type: ClusterIP
    port: 3306
    targetPort: 3306
  env:
    MYSQL_HOST: "mysql"
    MYSQL_PORT: "3306"
    MYSQL_ROOT_PASSWORD: "root"
    MYSQL_DATABASE: "bootdb"
  ingress:
    enabled: false
  nameOverride: mysql
  fullnameOverride: mysql
