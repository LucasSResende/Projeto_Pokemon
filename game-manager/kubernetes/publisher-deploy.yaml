apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher-manager
  labels:
    app: publisher-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publisher-manager
  template:
    metadata:
      labels:
        app: publisher-manager
    spec:
      containers:
        - name: publisher-manager
          image: adautomendes/publisher-manager
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_HOST
              value: "publisher-manager"
            - name: SERVER_PORT
              value: "8080"
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_PORT
              value: "3306"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
