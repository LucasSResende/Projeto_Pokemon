apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher-manager-deployment
  labels:
    app: publisher-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publisher-manager
  template:
    metadata:
      labels:
        app: publisher-manager
    spec:
      containers:
        - name: publisher-manager
          image: adautomendes/publisher-manager
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.env.SPRING_PROFILES_ACTIVE }}"
            - name: GAME_MANAGER_PORT
              value: "{{ .Values.env.GAME_MANAGER_PORT }}"
            - name: PUBLISHER_MANAGER_HOST
              value: publisher-manager
            - name: PUBLISHER_MANAGER_PORT
              value: "8080"
            - name: MYSQL_CONTAINER
              value: "{{ .Values.env.MYSQL_CONTAINER }}"
            - name: MYSQL_PORT
              value: "{{ .Values.env.MYSQL_PORT }}"