apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-manager-deployment
  labels:
    app: game-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-manager
  template:
    metadata:
      labels:
        app: game-manager
    spec:
      containers:
        - name: game-manager
          image: lucassresende/game-manager:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.env.SPRING_PROFILES_ACTIVE }}"
            - name: GAME_MANAGER_HOST
              value: "{{ .Values.env.GAME_MANAGER_HOST }}"
            - name: GAME_MANAGER_PORT
              value: "{{ .Values.env.GAME_MANAGER_PORT }}"
            - name: SERVER_HOST
              value: "{{ .Values.env.SERVER_HOST}}"
            - name: SERVER_PORT
              value: "{{ .Values.env.SERVER_PORT}}"
            - name: MYSQL_HOST
              value: "{{ .Values.env.MYSQL_HOST }}"
            - name: MYSQL_PORT
              value: "{{ .Values.env.MYSQL_PORT }}"