server.port=${SERVER_PORT:8081}
server.host=${SERVER_HOST:localhost}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/bootdb
publisher.manager.host=${PUBLISHER_MANAGER_HOST:localhost}
publisher.manager.port=${PUBLISHER_MANAGER_PORT:8080}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jackson.default-property-inclusion=NON_ABSENT
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
management.endpoints.web.exposure.include=*
